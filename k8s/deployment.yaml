


apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerwise-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careerwise-ai
  template:
    metadata:
      labels:
        app: careerwise-ai
    spec:
      containers:
        - name: careerwise-ai
          image: careerwise-ai:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5050

